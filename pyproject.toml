[project]
name = "ml-projects"
version = "0.1.0"
description = "Machine Learning projects with FastAPI and DDD architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # FastAPI & Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Machine Learning
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",

    # Model Persistence
    "joblib>=1.4.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",  # For testing FastAPI
    "black>=24.10.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
